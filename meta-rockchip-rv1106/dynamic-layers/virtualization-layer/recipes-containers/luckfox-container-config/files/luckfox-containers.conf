d /var/lib/containers 0755 root root -
d /var/lib/containers/tmp 0700 root root -
# docker-compose (the `podman compose` provider) reads registry credentials
# from ~/.docker/config.json, not from podman's auth file. Point it there so
# `podman login` / `docker login` also works for compose pulls.
d /root/.docker 0700 root root -
L /root/.docker/config.json - - - - /run/containers/0/auth.json
